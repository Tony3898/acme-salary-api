services:
  db:
    image: postgres:17-alpine
    container_name: acme-salary-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acme_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-acme_salary}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-acme} -d ${POSTGRES_DB:-acme_salary}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
