name: infra

# Creating and destroying the API server, by hand or on a timer.
#
# The whole point of the two-stack split is that this workflow is safe to run: it never
# touches the site, the DNS zone, the image registry or the roles GitHub trusts. It
# creates or deletes one VPC and one instance, and takes about four minutes either way.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do with the API server
        required: true
        type: choice
        default: deploy
        options: [deploy, destroy]
      stack:
        description: Which stack (persistent only changes with the site or the roles)
        required: true
        type: choice
        default: acme-salary-compute
        options: [acme-salary-compute, acme-salary-persistent]
  # Daily, to enforce the fortnight. Not a one-off schedule at deploy time plus 14 days:
  # a date baked into the template changes on every synth and reads as permanent drift.
  schedule:
    - cron: '0 19 * * *' # 00:30 IST, after the nightly stop

concurrency:
  group: infra
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  MAX_AGE_DAYS: 14

permissions:
  contents: read
  id-token: write

jobs:
  # ── The fortnight ─────────────────────────────────────────────────────────────
  # A demo deployment that outlives its demo is just a bill. This deletes the expensive
  # half once the instance is two weeks old; the site stays up and the workflow above
  # brings the API back in four minutes.
  expire:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::651025161973:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: How old is the server
        id: age
        run: |
          set -euo pipefail
          # Launch time rather than a tag: it cannot drift from the thing it describes,
          # and it survives somebody editing tags by hand.
          LAUNCHED=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=acme-salary" \
                      "Name=instance-state-name,Values=running,stopped" \
            --query 'Reservations[0].Instances[0].LaunchTime' --output text)

          if [ "$LAUNCHED" = "None" ] || [ -z "$LAUNCHED" ]; then
            echo "No instance. Nothing to expire."
            echo "expired=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AGE_DAYS=$(( ( $(date -u +%s) - $(date -u -d "$LAUNCHED" +%s) ) / 86400 ))
          echo "Launched $LAUNCHED, ${AGE_DAYS} days ago (limit ${MAX_AGE_DAYS})."
          echo "expired=$([ "$AGE_DAYS" -ge "$MAX_AGE_DAYS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Destroy the compute stack
        if: steps.age.outputs.expired == 'true'
        working-directory: infra
        run: |
          npm ci
          npx cdk destroy acme-salary-compute --force
          echo "::notice::acme-salary-compute destroyed after ${MAX_AGE_DAYS} days."
          echo "::notice::https://acme.tejasrana.in still serves; the API is gone until infra/deploy runs."

  # ── By hand ───────────────────────────────────────────────────────────────────
  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: write # to start deploy.yml on a freshly created server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      # TEMPORARY — delete once the first deploy succeeds.
      #
      # STS keeps answering "Not authorized to perform sts:AssumeRoleWithWebIdentity"
      # while the trust policy looks correct, so this prints what the trust policy is
      # actually being compared against. Only the `sub` and `aud` claims, which are the
      # two the condition tests; the token itself is never printed.
      - name: What does the OIDC token actually claim
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)

          # The payload is the middle segment, base64url. Decoded and read, not logged whole.
          CLAIMS=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || \
                   echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d --ignore-garbage)

          echo "sub = $(echo "$CLAIMS" | jq -r .sub)"
          echo "aud = $(echo "$CLAIMS" | jq -r .aud)"
          echo "iss = $(echo "$CLAIMS" | jq -r .iss)"
          echo
          echo "The trust policy must contain that exact sub, and that exact aud."

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::651025161973:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - working-directory: infra
        run: npm ci

      # Printed before anything changes, so the log says what the run was about to do
      # even when it then fails halfway.
      - name: Diff
        working-directory: infra
        run: npx cdk diff ${{ inputs.stack }} || true

      - name: ${{ inputs.action }}
        working-directory: infra
        run: |
          set -euo pipefail
          if [ "${{ inputs.action }}" = "destroy" ]; then
            npx cdk destroy ${{ inputs.stack }} --force
          else
            npx cdk deploy ${{ inputs.stack }} --require-approval never --outputs-file out.json
            cat out.json
          fi

      # A new instance has no containers on it. Rather than leave that to somebody
      # remembering, the deploy workflow is triggered here — which is what makes
      # recreating the API one click rather than two.
      - name: Release the API onto the new server
        if: inputs.action == 'deploy' && inputs.stack == 'acme-salary-compute'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --repo ${{ github.repository }} --ref main
          echo "::notice::Triggered deploy.yml. The API is live once it goes green."
