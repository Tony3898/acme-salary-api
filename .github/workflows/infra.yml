name: infra

# Creating and destroying the API server.
#
# The whole point of the two-stack split is that this workflow is safe to run: it never
# touches the site, the DNS zone, the image registry or the roles GitHub trusts. It
# creates or deletes one VPC and one instance, and takes about four minutes either way.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do with the API server
        required: true
        type: choice
        default: deploy
        options: [deploy, destroy]
      stack:
        description: Which stack (persistent only changes with the site or the roles)
        required: true
        type: choice
        default: acme-salary-compute
        options: [acme-salary-compute, acme-salary-persistent]

concurrency:
  group: infra
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: write # to start deploy.yml on a freshly created server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::651025161973:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - working-directory: infra
        run: npm ci

      # Printed before anything changes, so the log says what the run was about to do
      # even when it then fails halfway.
      - name: Diff
        working-directory: infra
        run: npx cdk diff ${{ inputs.stack }} || true

      - name: ${{ inputs.action }}
        working-directory: infra
        run: |
          set -euo pipefail
          if [ "${{ inputs.action }}" = "destroy" ]; then
            npx cdk destroy ${{ inputs.stack }} --force
          else
            npx cdk deploy ${{ inputs.stack }} --require-approval never --outputs-file out.json
            cat out.json
          fi

      # A new instance has no containers on it. Rather than leave that to somebody
      # remembering, the deploy workflow is triggered here — which is what makes
      # recreating the API one click rather than two.
      - name: Release the API onto the new server
        if: inputs.action == 'deploy' && inputs.stack == 'acme-salary-compute'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --repo ${{ github.repository }} --ref main
          echo "::notice::Triggered deploy.yml. The API is live once it goes green."
